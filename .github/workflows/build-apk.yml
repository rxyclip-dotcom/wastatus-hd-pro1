name: Build WA Status HD Pro Release APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/wa-status-hd-release.jks" \
            -storepass "WAStatusHD-Release-2026" \
            -alias "wastatushd" \
            -keypass "WAStatusHD-Release-2026" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WA Status HD Pro, OU=Mobile, O=WA Status HD Pro, L=Indonesia, C=ID"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/wa-status-hd-release.jks
          RELEASE_STORE_PASSWORD: WAStatusHD-Release-2026
          RELEASE_KEY_ALIAS: wastatushd
          RELEASE_KEY_PASSWORD: WAStatusHD-Release-2026
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk \
             release/WAStatusHD-Pro-v2.0-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WAStatusHD-Pro-v2.0-release
          path: release/WAStatusHD-Pro-v2.0-release.apk
          if-no-files-found: error
